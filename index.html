<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My MCQ App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="home-screen" class="container">
        <div id="auth-header" style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color);">
            <span id="user-welcome" style="font-size: 14px; color: var(--text-muted); font-weight: 500;">Please log in →</span>
            <div style="display: flex; align-items: center; gap: 8px;">
                <button id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme">🌓 Mode</button>
                <button id="login-btn" onclick="loginWithGoogle()">Sign In with Google</button>
                <button id="logout-btn" onclick="logout()" class="hide">Logout</button>
            </div>
        </div>

        <div class="tabs-nav-wrapper" style="display: flex; background-color: var(--tab-inactive-bg); padding: 4px; border-radius: 8px; margin-bottom: 25px; gap: 4px;">
            <button id="tab-available" class="tab-btn active-tab" onclick="switchTab('available')">
                Available Papers
            </button>
            <button id="tab-completed" class="tab-btn" onclick="switchTab('completed')">
                Completed Papers
            </button>
            <button id="tab-bookmarks" class="tab-btn" onclick="switchTab('bookmarks')">
                Bookmarks 🔖
            </button>
        </div>

        <div id="papers-list-container">
            <h2 class="section-title">Select an Exam Paper</h2>
            <div id="papers-list" class="papers-container"></div>
        </div>

        <div id="history-section" class="hide">
            <h2 class="section-title">Your Performance History</h2>
            <div id="history-list" class="vertical-stack-list"></div>
        </div>

        <div id="bookmarks-section" class="hide">
            <h2 class="section-title">Your Bookmarked Questions</h2>
            <div id="bookmarks-list" class="vertical-stack-list"></div>
        </div>
    </div>

    <div id="quiz-screen" class="container hide">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <button id="back-btn" onclick="goToHome()">← Back to Home</button>
            <button id="bookmark-toggle-btn" onclick="toggleCurrentBookmark()" style="border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 4px;">
                <span>🔖</span> Bookmark Question
            </button>
        </div>
        
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <p id="progress-text">Question 0 of 0</p>
        
        <h2 id="question-text" class="quiz-question">Question text will go here</h2>
        
        <div class="options-container">
            <button class="option-btn" onclick="checkAnswer(0)">Option 1</button>
            <button class="option-btn" onclick="checkAnswer(1)">Option 2</button>
            <button class="option-btn" onclick="checkAnswer(2)">Option 3</button>
            <button class="option-btn" onclick="checkAnswer(3)">Option 4</button>
        </div>

        <div id="explanation-box" class="hide">
            <strong>Explanation:</strong> <span id="explanation-text"></span>
        </div>

        <button id="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
